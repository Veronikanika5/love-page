<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Для тебя ❤️</title>
<style>
body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    font-family: Arial, sans-serif;
    background: linear-gradient(-45deg, #ff4e50, #fc913a, #f9d423, #ff4e50);
    background-size: 400% 400%;
    animation: gradient 10s ease infinite;
}

@keyframes gradient {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
}

h1 {
    color: white;
    font-size: 40px;
    text-align: center;
}

.buttons {
    margin-top: 30px;
}

button {
    padding: 15px 35px;
    font-size: 20px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    transition: 0.3s;
    margin: 10px;
}

#yes {
    background-color: #ff2e63;
    color: white;
}

#yes:hover {
    transform: scale(1.2);
}

#no {
    background-color: white;
    color: #ff2e63;
    position: relative;
}

.heart {
    position: fixed;
    color: red;
    font-size: 20px;
    animation: float 3s linear infinite;
}

@keyframes float {
    0% { transform: translateY(0); opacity: 1;}
    100% { transform: translateY(-100vh); opacity: 0;}
}
</style>
</head>
<body>

<h1>Ты будешь моим навсегда? ❤️</h1> <!-- Тут меняешь главный текст -->

<div class="buttons">
    <button id="yes">Да</button> <!-- Тут меняешь текст кнопки -->
    <button id="no">Нет</button> <!-- Тут меняешь текст кнопки -->
</div>

<audio id="music" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

<script>
const yes = document.getElementById("yes");
const no = document.getElementById("no");
const music = document.getElementById("music");

yes.addEventListener("click", () => {
    music.play();
    alert("Я так и знала 😍❤️");
    createHearts();
});

no.addEventListener("mouseover", () => {
    const x = Math.random() * (window.innerWidth - no.offsetWidth);
    const y = Math.random() * (window.innerHeight - no.offsetHeight);
    no.style.position = "absolute";
    no.style.left = x + "px";
    no.style.top = y + "px";
});

function createHearts() {
    for (let i = 0; i < 50; i++) {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = (Math.random() * 30 + 10) + "px";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 3000);
    }
}
</script>

</body>
</html>
