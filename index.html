<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Только для Саши ❤️</title>

<style>
body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    font-family: 'Comic Sans MS', cursive;

    /* ⬇⬇⬇ ВОТ ЗДЕСЬ ТЫ МОЖЕШЬ ПОСТАВИТЬ СВОЙ ФОН ⬇⬇⬇ */
    background-image: url('https://i.imgur.com/4M7IWwP.jpeg');
    /* ЗАМЕНИ ссылку внутри url('ТУТ') на свою */

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

.overlay {
    background: rgba(255,255,255,0.85);
    padding: 30px;
    border-radius: 20px;
    text-align: center;
}

h1 {
    color: #ff2e63;
}

button {
    padding: 15px 30px;
    font-size: 18px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    margin: 10px;
    transition: 0.3s;
}

.correct {
    background-color: #ff2e63;
    color: white;
}

.wrong {
    background-color: white;
    color: #ff2e63;
    position: relative;
}

button:hover {
    transform: scale(1.15);
}

.heart {
    position: fixed;
    color: red;
    font-size: 20px;
    animation: float 6s linear infinite;
}

@keyframes float {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
}

#game {
    display: none;
}

/* ⬇⬇⬇ ЕСЛИ ЗАХОЧЕШЬ ДОБАВИТЬ КАРТИНКУ ПОД ВОПРОС ⬇⬇⬇ */
/*
#questionImage {
    width: 200px;
    margin-bottom: 20px;
}
*/
</style>
</head>

<body>

<div id="startScreen" class="overlay">
    <h1>Если ты не мой Саша — уходите!! 😏</h1>
    <button onclick="startGame()">Это я, твой Саша ❤️</button>
</div>

<div id="game" class="overlay">

    <!-- ⬇⬇⬇ СЮДА МОЖНО ДОБАВИТЬ КАРТИНКУ ⬇⬇⬇ -->
    <!--
    <img id="questionImage" src="ТУТ_ССЫЛКА_НА_КАРТИНКУ">
    -->

    <h1 id="question"></h1>
    <div id="buttons"></div>
</div>
    
<script>

const funnyPhrases = [
"НЕПРАВИЛЬНО 😂",
"Так не работает 😏",
"Попробуй ещё раз 😜",
"Я всё равно знаю ответ 😌",
"Ты ошибся 😁",
"Нееееет 😆",
"Ты не угадал 😁",
"опять нееееет 😌",
"Ну хватиттт 😜",
"Душнилааа 😌"
];

const questions = [
{ text: "Ты меня любишь? ❤️", answers: ["Безумно ❤️", "Нет"] },

{ text: "Ты скучаешь по мне? 🥺", answers: ["Каждую секунду 💕", "Нет"] },

{ text: "Пойдёшь со мной на свидание? 💋", answers: ["Конечно 😍", "Нет"] },

{ text: "Будем смотреть фильм вместе? 🍿", answers: ["Дааа ❤️", "Нет"] },

{ text: "Будешь меня обнимать? 🤗", answers: ["Всегда 💖", "Нет"] },

{ text: "Я самая лучшая? 😏", answers: ["Естественно 😌", "Нет"] },

{ text: "Будешь носить меня на ручках? 😆", answers: ["Да, моя принцесса 👑", "Нет"] },

{ text: "Любишь мои глупости? 😂", answers: ["Обожаю 😁", "Нет"] },

{ text: "Будешь терпеть меня, когда я вредничаю? 😅", answers: ["С удовольствием 💕", "Нет"] },

{ text: "Ты счастлив со мной? 🥰", answers: ["Самый счастливый ❤️", "Нет"] },

{ text: "Будешь делиться со мной вкусняшками? 🍫", answers: ["Всегда 😋", "Нет"] },

{ text: "Разрешишь мне воровать твои худи? 😈", answers: ["Конечно 😎", "Нет"] },

{ text: "Будешь целовать меня просто так? 💋", answers: ["Каждый день 😍", "Нет"] },

{ text: "Будешь смеяться с моих шуток, даже если они странные? 🤡", answers: ["Конечно 😂", "Нет"] },

{ text: "Ты готов пройти этот тест до конца ради меня? 😏", answers: ["Дааа ❤️", "Нет"] }
];

let currentQuestion = 0;
const questionEl = document.getElementById("question");
const buttonsEl = document.getElementById("buttons");

function startGame() {
    document.getElementById("startScreen").style.display = "none";
    document.getElementById("game").style.display = "block";
    showQuestion();
}

function showQuestion() {
    buttonsEl.innerHTML = "";
    questionEl.innerText = questions[currentQuestion];

    const yesBtn = document.createElement("button");
    yesBtn.innerText = "Да ❤️";
    yesBtn.classList.add("correct");
    yesBtn.onclick = nextQuestion;

    const noBtn = document.createElement("button");
    noBtn.innerText = "Нет ❌";
    noBtn.classList.add("wrong");

    noBtn.onmouseover = () => {
        const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
        const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
        noBtn.style.position = "absolute";
        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";
        noBtn.innerText = funnyPhrases[Math.floor(Math.random() * funnyPhrases.length)];
    };

    buttonsEl.appendChild(yesBtn);
    buttonsEl.appendChild(noBtn);
}

function nextQuestion() {
    currentQuestion++;
    if (currentQuestion < questions.length) {
        showQuestion();
    } else {
        questionEl.innerText = "Ты прошёл тест 😍❤️";
        buttonsEl.innerHTML = "";
        createHearts();
    }
}

function createHearts() {
    for (let i = 0; i < 80; i++) {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = (Math.random() * 30 + 10) + "px";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 6000);
    }
}

</script>

</body>
</html>
