<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Только для моей Миррошки ❤️</title>

<style>
body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    font-family: 'Comic Sans MS', cursive;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    transition: background 1s ease-in-out;
}

.overlay {
    background: rgba(255,255,255,0.9);
    padding: 35px;
    border-radius: 25px;
    text-align: center;
    animation: fadeIn 1s ease;
    box-shadow: 0 0 30px rgba(0,0,0,0.2);
    max-width: 90%;
}

h1 {
    color: #ff2e63;
    animation: slideIn 0.8s ease;
}

/* 📌 БЛОК ДЛЯ КАРТИНКИ */
.question-image {
    margin: 15px 0;
    max-width: 250px;
    max-height: 250px;
    border-radius: 20px;
    animation: fadeIn 0.8s ease;
}

button {
    padding: 15px 30px;
    font-size: 18px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    margin: 10px;
    transition: 0.3s;
}

.correct {
    background-color: #ff2e63;
    color: white;
}

.wrong {
    background-color: white;
    color: #ff2e63;
    position: relative;
}

button:hover {
    transform: scale(1.15);
}

@keyframes fadeIn {
    from {opacity:0;}
    to {opacity:1;}
}

@keyframes slideIn {
    from {transform: translateY(-20px); opacity:0;}
    to {transform: translateY(0); opacity:1;}
}

.heart {
    position: fixed;
    animation: float 4s linear infinite;
}

@keyframes float {
    0% { transform: translateY(0); opacity: 1;}
    100% { transform: translateY(-100vh); opacity: 0;}
}

#game {
    display: none;
}
</style>
</head>

<body>

<div id="startScreen" class="overlay">
    <h1>Если ты не моя Дочурка — уходите! 😏</h1>
    <button onclick="startGame()">Это я, твоя Миррошка❤️</button>
</div>

<div id="game" class="overlay">
    <h1 id="question"></h1>

    <!-- 📌 ВОТ ТУТ БУДЕТ КАРТИНКА -->
    <img id="questionImage" class="question-image" src="" alt="gif">

    <div id="buttons"></div>
</div>

<script>

const gradients = [
"linear-gradient(135deg, #ff9a9e, #fad0c4)",
"linear-gradient(135deg, #a18cd1, #fbc2eb)",
"linear-gradient(135deg, #f6d365, #fda085)",
"linear-gradient(135deg, #84fab0, #8fd3f4)",
"linear-gradient(135deg, #ff758c, #ff7eb3)"
];

/* 📌 СЮДА ВСТАВЛЯЕШЬ ССЫЛКИ RAW С GITHUB */
const images = [
"https://github.com/Veronikanika5/love-page/blob/main/animation.gif.mp4.gif",
"https://github.com/Veronikanika5/love-page/blob/main/animation.gif.mp4%20(8).gif",
"https://github.com/Veronikanika5/love-page/blob/main/animation.gif.mp4%20(9).gif",
"https://github.com/Veronikanika5/love-page/blob/main/animation.gif.mp4%20(6).gif",
"https://github.com/Veronikanika5/love-page/blob/main/animation.gif.mp4%20(7).gif",
"https://github.com/Veronikanika5/love-page/blob/main/animation.gif.mp4%20(5).gif",
"https://github.com/Veronikanika5/love-page/blob/main/animation.gif.mp4%20(10).gif",
"https://github.com/Veronikanika5/love-page/blob/main/animation.gif.mp4%20(4).gif",
"https://github.com/Veronikanika5/love-page/blob/main/animation.gif.mp4%20(2).gif"
];

const funnyPhrases = [
"Эй 😄 подумай ещё раз!",
"Мама всё видит 👀",
"Так не считается 😜",
"Хитрюша 😂",
"Неееет, так нельзя 😆",
"Попробуй другой ответ 🤭",
"Ты уверена? 🤪",
"Неправильный ответ 🤭",
"Да ну ладно?! 🤔",
"А если хорошо подумать? 😘"
];

const questions = [
{ text: "Ты знаешь, как сильно мама тебя любит? ❤️", answers: ["Очень-очень сильно 💕", "Не знаю 🤔"] },
{ text: "Ты у меня самая красивая девочка? 👑", answers: ["Конечно 😌", "Ну может быть 🤭"] },
{ text: "Ты самая умная и талантливая? 🌟", answers: ["Дааа 😎", "Иногда 😅"] },
{ text: "Ты умеешь смешить маму? 😂", answers: ["Я профессионал 😁", "Неее 😆"] },
{ text: "Ты будешь всегда делиться секретиками с мамой? 🤫", answers: ["Обязательно 💖", "Посмотрим 😏"] },
{ text: "Ты знаешь, что мама всегда на твоей стороне? 🥰", answers: ["Знаю ❤️", "Ммм 🤨"] },
{ text: "Ты моя самая большая гордость? 🌸", answers: ["Дааа 🥹", "Ну чуть-чуть 🤭"] },
{ text: "Ты будешь обнимать маму даже когда вырастешь? 🤗", answers: ["Всегда 💕", "Только иногда 😜"] },
{ text: "Ты самая лучшая дочка во Вселенной? 🌍", answers: ["Естественно 😇", "Скромность наше всё 😁"] }
];

let currentQuestion = 0;
const questionEl = document.getElementById("question");
const buttonsEl = document.getElementById("buttons");
const imageEl = document.getElementById("questionImage");

function startGame() {
    document.getElementById("startScreen").style.display = "none";
    document.getElementById("game").style.display = "block";
    changeBackground();
    showQuestion();
}

function changeBackground() {
    document.body.style.background = gradients[currentQuestion % gradients.length];
}

function showQuestion() {
    buttonsEl.innerHTML = "";
    questionEl.innerText = questions[currentQuestion].text;

    /* 📌 МЕНЯЕМ КАРТИНКУ */
    imageEl.src = images[currentQuestion] || "";
    imageEl.style.display = images[currentQuestion] ? "block" : "none";

    questions[currentQuestion].answers.forEach((answer, index) => {
        const btn = document.createElement("button");
        btn.innerText = answer;

        if (index === 0) {
            btn.classList.add("correct");
            btn.onclick = nextQuestion;
        } else {
            btn.classList.add("wrong");
            btn.onmouseover = () => {
                const x = Math.random() * (window.innerWidth - 150);
                const y = Math.random() * (window.innerHeight - 50);
                btn.style.position = "absolute";
                btn.style.left = x + "px";
                btn.style.top = y + "px";
                btn.innerText = funnyPhrases[Math.floor(Math.random() * funnyPhrases.length)];
            };
        }

        buttonsEl.appendChild(btn);
    });
}

function nextQuestion() {
    currentQuestion++;
    if (currentQuestion < questions.length) {
        changeBackground();
        showQuestion();
    } else {
        showFinal();
    }
}

function showFinal() {
    questionEl.innerHTML = "Ты прошла тест 😍❤️<br><br>С Днем Рождения💋";
    imageEl.style.display = "none";
    buttonsEl.innerHTML = "";
    createHearts();
}

function createHearts() {
    for (let i = 0; i < 120; i++) {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = (Math.random() * 30 + 15) + "px";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 4000);
    }
}

</script>

</body>
</html>
