<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Только для Саши ❤️</title>

<style>
body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    font-family: 'Comic Sans MS', cursive;
    background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #ffdde1, #fbc2eb);
    background-size: 400% 400%;
    animation: gradient 12s ease infinite;
}

@keyframes gradient {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
}

h1 {
    color: #ff2e63;
    text-align: center;
    padding: 20px;
}

button {
    padding: 15px 30px;
    font-size: 18px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    margin: 10px;
    transition: 0.3s;
}

.correct {
    background-color: #ff2e63;
    color: white;
}

.wrong {
    background-color: white;
    color: #ff2e63;
}

button:hover {
    transform: scale(1.15);
}

.heart {
    position: fixed;
    color: red;
    font-size: 20px;
    animation: float 4s linear infinite;
}

@keyframes float {
    0% { transform: translateY(0); opacity: 1;}
    100% { transform: translateY(-100vh); opacity: 0;}
}

#startScreen {
    text-align: center;
}

#game {
    display: none;
}
</style>
</head>

<body>

<div id="startScreen">
    <h1>Если ты не мой Саша — уходите!! 😏</h1>
    <button onclick="startGame()">Это я, твой Саша ❤️</button>
</div>

<div id="game">
    <h1 id="question"></h1>
    <div id="buttons"></div>
</div>

<script>

const funnyPhrases = [
"Неправильный ответ, попробуй ещё 😜",
"Ах так значит? 😂",
"Я всё равно знаю правду 😏",
"Подумай хорошенько 😌",
"Ты уверен? 🤨"
];

const questions = [
{
    text: "Ты меня любишь? ❤️",
    answers: ["Да конечно ❤️", "Ну не знаю 🤔"]
},
{
    text: "Ты скучаешь по мне? 🥺",
    answers: ["Очень скучаю 💕", "Иногда 🙈"]
},
{
    text: "Пойдёшь со мной на свидание? 💋",
    answers: ["Дааа 😍", "Может быть 😅"]
},
{
    text: "Посмотрим вместе фильм? 🍿",
    answers: ["Обязательно ❤️", "Если будет вкусная еда 😂"]
}
];

let currentQuestion = 0;
const questionEl = document.getElementById("question");
const buttonsEl = document.getElementById("buttons");

function startGame() {
    document.getElementById("startScreen").style.display = "none";
    document.getElementById("game").style.display = "flex";
    showQuestion();
}

function showQuestion() {
    buttonsEl.innerHTML = "";
    questionEl.innerText = questions[currentQuestion].text;

    questions[currentQuestion].answers.forEach((answer, index) => {
        const btn = document.createElement("button");
        btn.innerText = answer;

        if (index === 0) {
            btn.classList.add("correct");
        } else {
            btn.classList.add("wrong");
        }

        btn.onclick = () => {
            if (index === 1) {
                btn.innerText = funnyPhrases[Math.floor(Math.random() * funnyPhrases.length)];
            }
            setTimeout(nextQuestion, 800);
        };

        buttonsEl.appendChild(btn);
    });
}

function nextQuestion() {
    currentQuestion++;
    if (currentQuestion < questions.length) {
        showQuestion();
    } else {
        questionEl.innerText = "Я тебя обожаю 😍❤️";
        buttonsEl.innerHTML = "";
        createHearts();
    }
}

function createHearts() {
    for (let i = 0; i < 80; i++) {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = (Math.random() * 30 + 10) + "px";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 4000);
    }
}

</script>

</body>
</html>
